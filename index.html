    <title>Toolbox</title>
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__pwaInstallPrompt = event
        window.dispatchEvent(new Event('pwa:installprompt'))
      })
    </script>
